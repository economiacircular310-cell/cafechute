{% extends "base.html" %}
{% from "macros.html" import icon with context %}
{% block content %}
<section class="thanks">
  <div class="container thanks__inner">
    <h1 class="display display--md">{{ meta_title }}</h1>
    <p class="lead">{{ message }}</p>
    <div class="btn-row btn-row--center">
      <a class="btn btn--dark" href="{{ url_page('home') }}">{{ t('cta.back_home') }}</a>
      <a class="btn btn--outline" href="{{ wa() }}" target="_blank" rel="noopener">{{ icon('whatsapp') }} WhatsApp</a>
    </div>
  </div>
</section>
{% endblock %}
